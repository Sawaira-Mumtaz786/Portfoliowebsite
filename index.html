<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --gradient: linear-gradient(135deg, #9333ea 0%, #db2777 100%);
  --gradient-soft: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
  --purple: #9333ea;
  --pink: #db2777;
  --green: #10b981;
  --bg-page: #faf5ff;
  --bg-card: #ffffff;
  --bg-muted: #f3e8ff;
  --text-primary: #1f2937;
  --text-secondary: #4b5563;
  --text-muted: #6b7280;
  --border: #f3e8ff;
  --border-strong: #e9d5ff;
  --font-heading: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --shadow-sm: 0 2px 8px rgba(147, 51, 234, 0.06);
  --shadow-md: 0 8px 24px rgba(147, 51, 234, 0.10);
  --shadow-lg: 0 20px 48px rgba(147, 51, 234, 0.16);
  --radius: 18px;
  --radius-sm: 12px;
  --radius-pill: 100px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

body {
  font-family: var(--font-body);
  background: var(--bg-page);
  color: var(--text-primary);

  -webkit-font-smoothing: antialiased;

}
.container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
section { padding: 96px 0; position: relative; }

.scroll-progress {
  position: fixed; top: 0; left: 0;
  height: 3px; width: 0%;
  background: var(--gradient);
  z-index: 1000;
  transition: width 0.1s linear;
  box-shadow: 0 0 12px rgba(219, 39, 119, 0.5);
}

.site-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid transparent;
  transition: var(--transition);
}
.site-header.scrolled {
  border-bottom-color: var(--border);
  box-shadow: 0 4px 20px rgba(147, 51, 234, 0.06);
}
.nav-wrap { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; }
.brand {
  font-family: var(--font-heading); font-weight: 700; font-size: 1.25rem;
  background: var(--gradient);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.nav-list { display: flex; align-items: center; gap: 28px; }
.nav-list a {
  font-size: 0.9rem; font-weight: 500;
  color: var(--text-secondary);
  transition: var(--transition);
  position: relative;
}
.nav-list a:not(.nav-cta)::after {
  content: ''; position: absolute;
  bottom: -4px; left: 0; right: 0;
  height: 2px; background: var(--gradient);
  transform: scaleX(0); transform-origin: right;
  transition: transform 0.3s ease;
  border-radius: 2px;
}
.nav-list a:not(.nav-cta):hover::after { transform: scaleX(1); transform-origin: left; }
.nav-list a:hover { color: var(--purple); }
.nav-list a.nav-cta {
  background: var(--gradient); color: #fff;
  padding: 9px 22px; border-radius: var(--radius-pill);
  font-weight: 600;
  box-shadow: 0 4px 14px rgba(147, 51, 234, 0.3);
}
.nav-list a.nav-cta:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 22px rgba(147, 51, 234, 0.45);
  color: #fff;
}
.hamburger {
  display: none; flex-direction: column; gap: 5px;
  background: none; border: none; cursor: pointer; padding: 6px;
}
.hamburger span {
  display: block; width: 24px; height: 2.5px;
  background: var(--purple); border-radius: 4px;
  transition: var(--transition);
}

.hero {
  padding: 100px 0 80px;
  background: linear-gradient(180deg, #faf5ff 0%, #ffffff 100%);
  position: relative; overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; top: -100px; right: -100px;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(236, 72, 153, 0.12) 0%, transparent 70%);
  border-radius: 50%; pointer-events: none;
  animation: float 8s ease-in-out infinite;
}
.hero::after {
  content: ''; position: absolute; bottom: -120px; left: -120px;
  width: 480px; height: 480px;
  background: radial-gradient(circle, rgba(147, 51, 234, 0.10) 0%, transparent 70%);
  border-radius: 50%; pointer-events: none;
  animation: float 10s ease-in-out infinite reverse;
}
@keyframes float {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(20px, -20px); }
}
.hero-inner {

  display: grid; grid-template-columns: 1.5fr 1fr;
  gap: 60px; align-items: center;
}
.status-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: #fff; border: 1px solid var(--border-strong);
  padding: 7px 16px; border-radius: var(--radius-pill);
  font-size: 0.78rem; font-weight: 600; color: var(--purple);
  margin-bottom: 22px; box-shadow: var(--shadow-sm);
}
.status-dot {
  width: 8px; height: 8px; background: var(--green); border-radius: 50%;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
  50% { opacity: 0.9; transform: scale(1.05); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
}
.hero h1 {
  font-family: var(--font-heading);
  font-size: clamp(2.4rem, 5.5vw, 3.4rem);
  font-weight: 700; line-height: 1.08;
  letter-spacing: -0.03em; color: #111827;
  margin-bottom: 10px;
}
.hero .role {

  font-size: clamp(1.05rem, 2vw, 1.3rem);
  font-weight: 600; color: var(--purple);
  margin-bottom: 20px;
}
.hero .summary {
  font-size: 1rem; color: var(--text-secondary);
  line-height: 1.8; margin-bottom: 28px; max-width: 620px;
}
.hero .summary strong { color: #111827; font-weight: 600; }

.hero-stats {
  display: flex; flex-wrap: wrap;
  gap: 32px; margin-bottom: 32px;
  padding: 20px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);

}
.stat-item { display: flex; flex-direction: column; gap: 2px; }

  line-height: 1;
}
.stat-label {

}

.hero-buttons { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 26px; }
.btn {

.btn-outline {

}
.hero-social { display: flex; gap: 12px; }
.hero-social a {

  width: 42px; height: 42px; border-radius: 50%;

}
.hero-social a:hover {
  background: var(--gradient); color: #fff;
  border-color: transparent; transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(147, 51, 234, 0.4);
}
.hero-visual { display: flex; justify-content: center; align-items: center; }
.avatar-ring {
  width: 280px; height: 280px; border-radius: 50%;
  background: var(--gradient); padding: 5px;
  box-shadow: 0 20px 50px rgba(147, 51, 234, 0.28);

}
.avatar-ring::before {
  content: ''; position: absolute; inset: -12px; border-radius: 50%;

}
@keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.avatar-inner {
  width: 100%; height: 100%; border-radius: 50%;
  background: #fdfbff; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.avatar-inner img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center top;
}

.section-head { text-align: center; margin-bottom: 56px; }
.section-label {
  display: inline-block; font-size: 0.72rem; font-weight: 700;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--purple); background: var(--bg-muted);

.about { background: #fff; }

.learning-box {

}

.about-highlights { display: flex; flex-direction: column; gap: 16px; }
.highlight {

.skills { background: #faf5ff; }
.skills-grid {

  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));

}
.skill-card {

.skill-tags span:hover {

.projects { background: #fdf2f8; }

.project-card {

.project-thumb {
